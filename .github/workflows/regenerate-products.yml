name: Regenerate website products

on:
  push:
    branches:
      - main
    paths:
      - 'assets/images/tote_bags_catlog/**'
      - 'generate-products.ps1'
      - 'update-image.ps1'
      - 'index.html'
      - 'README.md'
      - '.github/workflows/regenerate-products.yml'

jobs:
  regenerate-products:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Create generate-products script (if missing)
        run: |
          if (-not (Test-Path "generate-products.ps1")) {
            Write-Host "Script not found, using inline version"
          }

      - name: Run product generator
        shell: pwsh
        run: |
          # Create products.json from images in assets/images/tote_bags_catlog
          $imageFolder = "assets/images/tote_bags_catlog"
          $outputFile = "products.json"
          $defaultPrice = 699

          if (-not (Test-Path $imageFolder)) {
              Write-Error "Image folder not found: $imageFolder"
              exit 1
          }

          $images = Get-ChildItem -Path $imageFolder -File | Where-Object { $_.Extension -match '\.(png|jpg|jpeg|webp)$' } | Sort-Object Name
          $products = @()
          foreach ($img in $images) {
              $name = [System.IO.Path]::GetFileNameWithoutExtension($img.Name)
              $title = $name -replace '[-_0-9]+' , ' '
              $title = (Get-Culture).TextInfo.ToTitleCase($title.ToLower()).Trim()
              $obj = [PSCustomObject]@{
                  name = $title
                  price = $defaultPrice
                  tags = @()
                  img = "$imageFolder/$($img.Name)"
                  badge = ""
                  alt = "Haridha Tote - $title"
              }
              $products += $obj
          }

          $products | ConvertTo-Json -Depth 4 | Set-Content -Path $outputFile -Encoding UTF8
          Write-Host "Wrote $($products.Count) products to $outputFile"

      - name: Commit updated products.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet -- products.json
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: regenerate products.json from tote_bags_catlog"
            git push
          } else {
            Write-Host "No changes to products.json"
          }
